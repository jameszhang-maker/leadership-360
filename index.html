<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leadership 360 — Developing the Leader Within You 2.0</title>
<style>
:root{
  --bg:#FAF8F5; --surface:rgba(32,28,26,.035); --surface-2:rgba(32,28,26,.06);
  --fg:#202020; --fg-muted:#606060; --fg-faint:#909090;
  --hair:rgba(180,130,80,.22); --hair-2:rgba(180,130,80,.12);
  --primary:#FF9019; --accent:linear-gradient(135deg,#CD6A00 0%,#FF9019 100%); --accent-ink:#fff;
  --radius:16px; --radius-sm:8px; --radius-lg:24px;
  --shadow:0 12px 40px rgba(100,50,0,.15);
  --font-head:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --font-body:'Lato','Helvetica Neue',Arial,sans-serif;
  --dur:.28s; --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#161412; --surface:rgba(255,245,235,.05); --surface-2:rgba(255,245,235,.09);
    --fg:#F2EEE9; --fg-muted:#B0A79E; --fg-faint:#8A817A;
    --hair:rgba(255,180,110,.24); --hair-2:rgba(255,180,110,.13);
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font-body);
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding:0 20px 80px;
}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3,.h{font-family:var(--font-head);font-weight:700;letter-spacing:-.01em;line-height:1.2;margin:0}
h1{font-size:clamp(28px,6vw,40px)}
h2{font-size:clamp(21px,4vw,26px)}
h3{font-size:17px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-muted);font-weight:700}
p{margin:0 0 16px}
.muted{color:var(--fg-muted)}
.faint{color:var(--fg-faint);font-size:14px}
.eyebrow{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);margin:0 0 12px}
header.top{padding:36px 0 8px;border-bottom:1px solid var(--hair-2);margin-bottom:32px}
header.top .rule{width:44px;height:4px;background:var(--accent);border-radius:2px;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--hair-2);border-radius:var(--radius);padding:24px}
.stack>*+*{margin-top:14px}
.spacer{height:28px}

button,.btn{font-family:var(--font-head);font-size:16px;font-weight:600;cursor:pointer;
  border-radius:var(--radius-sm);border:1px solid var(--hair);background:var(--surface);
  color:var(--fg);padding:14px 20px;transition:all var(--dur) var(--ease);text-align:left;
  display:inline-block;text-decoration:none}
button:hover,.btn:hover{background:var(--surface-2);border-color:var(--primary)}
button:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
button:disabled:hover{background:var(--surface);border-color:var(--hair)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08);border-color:transparent}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}
.btn-block{display:block;width:100%}
.link{background:none;border:none;color:var(--fg-muted);text-decoration:underline;
  padding:8px 0;font-size:15px;font-family:var(--font-body);font-weight:400}
.link:hover{background:none;border:none;color:var(--primary)}

label{display:block;font-family:var(--font-head);font-weight:600;font-size:14px;margin:0 0 8px}
input[type=text],textarea{width:100%;font-family:var(--font-body);font-size:17px;color:var(--fg);
  background:var(--bg);border:1px solid var(--hair);border-radius:var(--radius-sm);padding:13px 14px}
input[type=text]:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:transparent}
textarea{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;line-height:1.7}

/* progress */
.prog{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.prog .bar{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width var(--dur) var(--ease)}
.prog .n{font-family:var(--font-head);font-size:13px;font-weight:700;color:var(--fg-muted);white-space:nowrap}

/* scenario */
.scenario{font-size:clamp(19px,3.4vw,22px);line-height:1.45;margin:0 0 8px}
.ask{font-family:var(--font-head);font-weight:700;font-size:15px;color:var(--primary);margin:0 0 20px}
.opt{display:block;width:100%;margin:0 0 10px;padding:16px 18px;font-family:var(--font-body);
  font-size:16px;font-weight:400;line-height:1.45;min-height:56px}
.opt:hover{background:var(--surface-2);border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--surface-2);box-shadow:inset 3px 0 0 var(--primary)}
.opt.small{display:inline-block;width:auto;min-height:auto;padding:8px 14px;font-size:14px;margin:0 8px 8px 0}

/* code / link display */
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.01em;
  word-break:break-all;background:var(--bg);border:1px dashed var(--primary);
  border-radius:var(--radius-sm);padding:16px;margin:0 0 12px}

/* overview */
.headline{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);
  padding:30px;margin-bottom:32px;border-top:4px solid var(--primary)}
.headline .lvl{font-family:var(--font-head);font-size:clamp(26px,6vw,36px);font-weight:700;
  line-height:1.15;margin:6px 0 10px}
.avgnum{font-family:var(--font-head);font-weight:700;font-size:clamp(48px,10vw,68px);line-height:1;margin:6px 0 4px}

/* pyramid — stepped tiers, Position (widest) at the base rising to Pinnacle
   (narrowest) at the apex. Each tier is full-width for its label row so
   names/scores stay legible regardless of how narrow the bar itself is. */
.pyr{margin:18px 0 6px}
.pyr .tier{margin-bottom:10px}
.pyr .tier .lbl{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--font-head);font-size:13px;font-weight:700;margin-bottom:5px}
.pyr .tier .lbl .score{color:var(--fg-muted);font-weight:700;font-size:13px}
.pyr .tier .bar{height:26px;border-radius:6px;background:var(--surface-2);margin:0 auto;
  transition:background var(--dur) var(--ease)}
.pyr .tier.on .bar{background:var(--accent)}

/* trait / round rows */
.traitrow{padding:18px 0;border-bottom:1px solid var(--hair-2)}
.traitrow:last-child{border-bottom:none}
.traitrow .nm{font-family:var(--font-head);font-weight:700;font-size:16px;margin-bottom:2px}
.traitrow .dsc{font-size:14px;color:var(--fg-muted);margin-bottom:12px}
.gbar{display:grid;grid-template-columns:64px 1fr 42px;align-items:center;gap:10px;margin-bottom:6px}
.gbar .k{font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--fg-muted);text-align:right}
.gbar .t{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.gbar .t i{display:block;height:100%;border-radius:7px;background:var(--fg-faint)}
.gbar.self .t i{background:var(--fg-muted)}
.gbar.others .t i{background:var(--accent)}
.gbar .v{font-family:var(--font-head);font-size:13px;font-weight:700;text-align:right}

.roundrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:16px 0;border-bottom:1px solid var(--hair-2);cursor:default}
.roundrow:last-child{border-bottom:none}
.roundrow .d{font-family:var(--font-head);font-weight:700;font-size:16px}
.roundrow .meta{font-size:13px;color:var(--fg-faint)}
.reviewrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--hair-2)}
.reviewrow:last-child{border-bottom:none}
.reviewrow .q{font-size:14px;margin-bottom:2px}
.reviewrow .a{font-weight:600}

.flag{border-left:3px solid var(--primary);padding:14px 18px;background:var(--surface);
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:12px}
.flag.up{border-left-color:#2E9E5B}
.flag .t{font-family:var(--font-head);font-weight:700;font-size:15px;margin-bottom:4px}
.split{border:1px solid var(--hair-2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.split .sc{font-size:16px;margin-bottom:14px}
.split .pair{display:grid;grid-template-columns:1fr;gap:10px}
.split .box{padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface);font-size:15px}
.split .box b{display:block;font-family:var(--font-head);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--fg-muted);margin-bottom:4px}
.split .box.o{border-left:3px solid var(--primary)}
.move{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--hair-2)}
.move:last-child{border-bottom:none}
.move .num{font-family:var(--font-head);font-weight:700;font-size:26px;color:var(--primary);
  line-height:1;min-width:32px}
.move .ref{font-family:var(--font-head);font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--fg-faint);margin-top:6px}
.err{border-left:3px solid #C0392B;background:var(--surface);padding:12px 16px;
  border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin-bottom:16px;font-size:15px}
.pill{display:inline-block;font-family:var(--font-head);font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--fg-muted);
  border-radius:20px;padding:5px 12px;margin:0 6px 6px 0}
@media(min-width:600px){ .split .pair{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="rule"></div>
    <div class="eyebrow">Developing the Leader Within You 2.0</div>
    <h1>Leadership 360</h1>
  </header>
  <main id="app"></main>
</div>

<script>
/* Real backend — no data ever leaves the browser in a copy/paste code anymore. */
const API_BASE = "https://1g9ewfu8dc.execute-api.us-east-1.amazonaws.com";

/* ============================================================================
   ITEM BANK — 36 scenarios, four per trait.
   `s` is the maturity score (1–5) and is never shown or implied to the user.
   `w` maps the item onto the five Levels of Leadership (used only for the
   report's overview score and pyramid); `tw` maps it onto named traits,
   one per book chapter — the report's main breakdown. `ch` mirrors `tw`'s keys
   and drives the "next moves" lookup. Both weight objects sum to 1 per item.
   Items are interleaved so no two consecutive scenarios share a trait.
   ========================================================================== */
const ITEMS = [
/* -- 1 · Priorities ------------------------------------------------------ */
{
  ch:[2], w:{1:.7,3:.3}, tw:{2:1},
  self:"You blocked out this morning weeks ago for the one piece of work that genuinely moves your year forward — the kind that never happens unless it is protected. At 9:10 a colleague arrives at your desk with something that has to be sorted today.",
  other:"{N} blocked out the morning weeks ago for the one piece of work that genuinely moves their year forward — the kind that never happens unless it is protected. At 9:10 a colleague arrives with something that has to be sorted today.",
  opts:[
    {t:"Drops the morning's work and deals with it. Someone asked, and it is genuinely urgent.",s:1},
    {t:"Handles it quickly, then tries to salvage what is left of the morning.",s:2},
    {t:"Asks how long it can wait, and books it into the afternoon.",s:3},
    {t:"Asks who else could own it, and hands it over with what they need to succeed.",s:4},
    {t:"Protects the morning. This kind of interruption has already been designed out of most weeks.",s:5}
  ]
},
/* -- 2 · Character ------------------------------------------------------- */
{
  ch:[3], w:{5:.6,1:.4}, tw:{3:1},
  self:"You come out of a meeting with senior leadership where some hard decisions were made, and walk straight into a meeting with your own team about the same subject. Some of what was said upstairs will not be welcome downstairs.",
  other:"{N} comes out of a meeting with senior leadership where some hard decisions were made, and walks straight into a meeting with their own team about the same subject. Some of what was said upstairs will not be welcome downstairs.",
  opts:[
    {t:"The two versions are quite different. Each room hears what it needs to hear.",s:1},
    {t:"The message is the same, but the tone shifts a lot depending on the room.",s:2},
    {t:"Mostly consistent, though the harder detail only really gets said upwards.",s:3},
    {t:"Same message, same detail, both rooms.",s:4},
    {t:"Same message, same detail — and the uncomfortable part gets said in the room where it costs them most.",s:5}
  ]
},
/* -- 3 · Leading Change -------------------------------------------------- */
{
  ch:[4], w:{3:.6,2:.4}, tw:{4:1},
  self:"A change you have been planning for months is announced at the team meeting. It affects how everyone works day to day. Two of your most experienced people push back hard, in front of everyone, and the room goes quiet.",
  other:"A change {N} has been planning for months is announced at the team meeting. It affects how everyone works day to day. Two of the most experienced people push back hard, in front of everyone, and the room goes quiet.",
  opts:[
    {t:"Restates the decision and the reasons for it, and moves the meeting on.",s:1},
    {t:"Defends the plan point by point until the objections stop.",s:2},
    {t:"Acknowledges the pushback and offers to talk it through one to one afterwards.",s:3},
    {t:"Stops the agenda, asks the two what they would be losing if this went ahead, and lets the room hear the answer.",s:4},
    {t:"Had already met both of them before the announcement. The meeting is where they help carry it.",s:5}
  ]
},
/* -- 4 · Problem Solving ------------------------------------------------- */
{
  ch:[5], w:{3:.7,1:.3}, tw:{5:1},
  self:"A problem has surfaced that sits squarely between your team and another. It is not clearly anyone's job, both teams have reasons not to pick it up, and it is getting worse each week it sits there.",
  other:"A problem has surfaced that sits squarely between {N}'s team and another. It is not clearly anyone's job, both teams have reasons not to pick it up, and it is getting worse each week it sits there.",
  opts:[
    {t:"Escalates it. Someone above needs to decide who owns this.",s:1},
    {t:"Raises it with the other team and waits to see what they do.",s:2},
    {t:"Takes it on, and works it out alone.",s:3},
    {t:"Gets the right people in a room, and they leave with an owner and a first step.",s:4},
    {t:"Flagged this one weeks ago, before it was a problem. The fix is already running.",s:5}
  ]
},
/* -- 5 · Attitude -------------------------------------------------------- */
{
  ch:[6], w:{2:.7,5:.3}, tw:{6:1},
  self:"Nothing is badly wrong, but a low-grade grumbling has settled over your team across the last couple of months. It shows up in side conversations and in the tone of meetings more than in anything anyone says directly.",
  other:"Nothing is badly wrong, but a low-grade grumbling has settled over {N}'s team across the last couple of months. It shows up in side conversations and in the tone of meetings more than in anything anyone says directly.",
  opts:[
    {t:"Leaves it. Every team grumbles, and it passes.",s:1},
    {t:"Tells the team to focus on the positives.",s:2},
    {t:"Works out where it is coming from and has a quiet word with that person.",s:3},
    {t:"Names it openly with the team and asks what is actually behind it.",s:4},
    {t:"Is consistently the first to say out loud what is working, asks people what they would change, then changes one of them.",s:5}
  ]
},
/* -- 6 · Serving People -------------------------------------------------- */
{
  ch:[7], w:{2:.6,4:.4}, tw:{7:1},
  self:"Someone who joined your team six weeks ago is visibly out of their depth. Their work is coming in late and needing rework. They have not asked anyone for help, and nobody has offered.",
  other:"Someone who joined {N}'s team six weeks ago is visibly out of their depth. Their work is coming in late and needing rework. They have not asked anyone for help, and nobody has offered.",
  opts:[
    {t:"Waits. Asking for help is part of the job, and they will get there.",s:1},
    {t:"Tightens up the instructions and checks the work more closely.",s:2},
    {t:"Asks how they are finding it at the next scheduled catch-up.",s:3},
    {t:"Goes to them, names what they have noticed without judgement, and asks what would help.",s:4},
    {t:"Already knows what they are struggling with, because they have been asking what this job is like from where that person sits.",s:5}
  ]
},
/* -- 7 · Vision ---------------------------------------------------------- */
{
  ch:[8], w:{5:.5,4:.5}, tw:{8:1},
  self:"In a one-to-one, someone on your team stops the usual agenda and asks you directly: where is all this actually going? What are we building here? They mean it seriously.",
  other:"In a one-to-one, someone on {N}'s team stops the usual agenda and asks directly: where is all this actually going? What are we building here? They mean it seriously.",
  opts:[
    {t:"Gives them the targets, and what is expected this quarter.",s:1},
    {t:"Repeats the organisation's strategy as it was handed down.",s:2},
    {t:"Explains where the team is heading over the next couple of years.",s:3},
    {t:"Paints the picture clearly enough that the person could describe it to someone else.",s:4},
    {t:"Paints the picture, then asks that person where they see themselves in it.",s:5}
  ]
},
/* -- 8 · Self-Discipline ------------------------------------------------- */
{
  ch:[9], w:{1:.6,5:.4}, tw:{9:1},
  self:"There is a standing commitment in your week that nobody else would notice disappearing — the numbers review, the one-to-one with the quietest person on your team, the hour you keep for reading. A genuinely brutal week hits.",
  other:"There is a standing commitment in {N}'s week that nobody else would notice disappearing — the numbers review, the one-to-one with the quietest person on the team, the hour kept for reading. A genuinely brutal week hits.",
  opts:[
    {t:"It goes. It is the obvious thing to drop when the week is full.",s:1},
    {t:"It gets pushed, and picked up again once things settle.",s:2},
    {t:"It gets shortened, but it still happens.",s:3},
    {t:"It happens as normal. It is booked like anything else in the diary.",s:4},
    {t:"It happens as normal, and the team have noticed that it always does.",s:5}
  ]
},
/* -- 9 · Personal Growth ------------------------------------------------- */
{
  ch:[10], w:{4:.7,2:.3}, tw:{10:1},
  self:"One of your strongest people asks to lead a piece of work that is genuinely above where they are today. They might not pull it off, and it matters enough that failure would be felt.",
  other:"One of {N}'s strongest people asks to lead a piece of work that is genuinely above where they are today. They might not pull it off, and it matters enough that failure would be felt.",
  opts:[
    {t:"Says not yet, and gives them something closer to their level.",s:1},
    {t:"Gives it to them and lets them sink or swim.",s:2},
    {t:"Gives it to them, and stays close enough to catch it if it goes wrong.",s:3},
    {t:"Gives it to them, and puts regular time in the diary to work through it together.",s:4},
    {t:"Gives it to them, works through it with them, and lets them take it to the leadership team themselves.",s:5}
  ]
},
/* -- 10 · Priorities ----------------------------------------------------- */
{
  ch:[2], w:{1:.6,3:.4}, tw:{2:1},
  self:"A well-run organisation you respect invites you onto a new working group. The people are good, the work matters, and it would raise your profile. It also has nothing to do with the three priorities you set for yourself this year.",
  other:"A well-run organisation invites {N} onto a new working group. The people are good, the work matters, and it would raise their profile. It also has nothing to do with the three priorities {N} set for the year.",
  opts:[
    {t:"Says yes. Opportunities like this do not come round twice.",s:1},
    {t:"Says yes, then quietly struggles to fit it around everything else.",s:2},
    {t:"Asks for time to think, and says yes to a smaller version of it.",s:3},
    {t:"Declines, and says what they are saying yes to instead.",s:4},
    {t:"Declines, and puts forward someone on the team for whom it would be a stretch worth having.",s:5}
  ]
},
/* -- 11 · Character ------------------------------------------------------ */
{
  ch:[3], w:{5:.6,1:.4}, tw:{3:1},
  self:"A piece of work your team delivered has gone down well. In a leadership meeting, a senior executive singles you out by name and praises the result. Most of the actual work was done by two people on your team.",
  other:"A piece of work {N}'s team delivered has gone down well. In a leadership meeting, a senior executive singles {N} out by name and praises the result. Most of the actual work was done by two people on the team.",
  opts:[
    {t:"Accepts the praise. It was their team, and leading it was the contribution.",s:1},
    {t:"Says the team worked hard on it.",s:2},
    {t:"Mentions that two people did most of the work.",s:3},
    {t:"Names both people, and says specifically what each of them did.",s:4},
    {t:"Names both people, and makes sure they hear the praise directly from the executive.",s:5}
  ]
},
/* -- 12 · Leading Change ------------------------------------------------- */
{
  ch:[4], w:{3:.7,2:.3}, tw:{4:1},
  self:"Three months into a change you led, the early energy has gone. Results have dipped — which everyone was warned would happen — but the dip has lasted longer than you said it would. People are asking openly whether it is worth continuing.",
  other:"Three months into a change {N} led, the early energy has gone. Results have dipped — which everyone was warned would happen — but the dip has lasted longer than promised. People are asking openly whether it is worth continuing.",
  opts:[
    {t:"Pushes harder. The plan was right, and people need to see it through.",s:1},
    {t:"Quietly scales the change back to something less disruptive.",s:2},
    {t:"Reassures people that the dip was expected, and holds the line.",s:3},
    {t:"Finds the parts that are working, makes them visible, and celebrates them by name.",s:4},
    {t:"Shows the team the progress they cannot see from where they are standing, and is honest about what is still ahead.",s:5}
  ]
},
/* -- 13 · Problem Solving ------------------------------------------------ */
{
  ch:[5], w:{3:.6,4:.4}, tw:{5:1},
  self:"The same problem has come back for the fourth time this year. Each time the team patches it, it works for a while, and everyone moves on. Patching it again would take an afternoon.",
  other:"The same problem has come back for the fourth time this year. Each time, {N}'s team patches it, it works for a while, and everyone moves on. Patching it again would take an afternoon.",
  opts:[
    {t:"Patches it again. It works, and there are bigger things to deal with.",s:1},
    {t:"Patches it, and adds it to the list of things to look at properly one day.",s:2},
    {t:"Sets aside time to work out the real cause themselves.",s:3},
    {t:"Asks the team what is actually causing this, and picks from the options they come back with.",s:4},
    {t:"Hands the whole thing to someone on the team to solve, and backs the answer they come up with.",s:5}
  ]
},
/* -- 14 · Attitude ------------------------------------------------------- */
{
  ch:[6], w:{2:.5,5:.5}, tw:{6:1},
  self:"A decision you pushed for, against some resistance, has clearly not worked. It is visible across the organisation, and other people have absorbed some of the cost of it.",
  other:"A decision {N} pushed for, against some resistance, has clearly not worked. It is visible across the organisation, and other people have absorbed some of the cost of it.",
  opts:[
    {t:"Explains the circumstances that made it the right call at the time.",s:1},
    {t:"Accepts that it did not work, and moves the conversation on to the fix.",s:2},
    {t:"Owns it privately with their own leader, and keeps it low-key with the team.",s:3},
    {t:"Says plainly to the team that it was their call and it was wrong.",s:4},
    {t:"Says it was their call, says what they got wrong, and says what they will do differently — in front of the people who paid for it.",s:5}
  ]
},
/* -- 15 · Serving People ------------------------------------------------- */

// M/P/D/O = manager/peer/direct-report/other, self-declared by a rater who's
// comfortable being identified by role. X = prefer not to say.
const ROLE_LABELS = {M:"I am their manager", P:"We are peers", D:"They lead me", O:"Something else", X:"Prefer not to say"};
const ROLE_SHORT = {S:"Self",M:"Manager",P:"Peers",D:"Direct reports",O:"Others",X:"Unspecified"};
const LEVEL_KEYS = [1,2,3,4,5];
const TRAIT_KEYS = [2,3,4,5,6,7,8,9,10];

// THRESHOLD: minimum weighted-mean score (1-5) a level must clear to count as
// "held" for Maxwell's floor rule — set above the scale midpoint (3) so a
// level must be clearly, not just narrowly, endorsed.
const THRESHOLD = 3.5;
// GAP: minimum self-vs-others difference treated as a real blind spot /
// hidden strength rather than ordinary rater noise on a 5-point scale.
const GAP = 0.75;
// SPLIT_CUTOFF: only surface scenarios where self and the raters' modal
// answer differ by a full maturity point or more — smaller gaps are within
// normal rater disagreement and aren't worth spotlighting.
const SPLIT_CUTOFF = 1;
// FLAG_LIMIT: with nine traits a leader can technically clear the GAP
// threshold on most of them; showing all of them buries the signal, so cap
// the callouts at the widest few and count the rest.
const FLAG_LIMIT = 3;
// TAP_DEBOUNCE_MS: ignore a second option tap this soon after a render, so a
// double-tap or ghost-click on a phone can't blind-answer the next question.
const TAP_DEBOUNCE_MS = 350;

/* ---------------------------------------------------------------- scoring */
function scoresFor(ans, field, keys){
  const out={};
  keys.forEach(k=>{
    let num=0,den=0;
    ITEMS.forEach((it,i)=>{
      const w=it[field][k]; if(!w) return;
      num += w*it.opts[ans[i]].s; den += w;
    });
    out[k]= den ? num/den : 0;
  });
  return out;
}
function levelScores(ans){ return scoresFor(ans,'w',LEVEL_KEYS); }
function traitScores(ans){ return scoresFor(ans,'tw',TRAIT_KEYS); }
function consolidatedLevel(scores){
  let f=0;
  for(let L=1;L<=5;L++){ if(scores[L]>=THRESHOLD) f=L; else break; }
  return f;
}
function mean(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }

// Tie-break: among options tied for the most rater votes, prefer the one
// with the highest maturity score, so a tie never silently favors the
// harshest reading (ascending-key sort would otherwise always resolve a
// tie toward the lowest-scored option).
function modalOption(counts, opts){
  const keys = Object.keys(counts);
  let best = keys[0];
  keys.forEach(k=>{
    if(counts[k] > counts[best]) best = k;
    else if(counts[k] === counts[best] && opts[k].s > opts[best].s) best = k;
  });
  return best;
}

// Subject-agnostic on purpose: this sentence sits under a pyramid whose
// eyebrow label already says whose read it is (self / a rater / everyone),
// so it doesn't need to embed "you"/"they" itself.
function floorSentence(levels){
  const lvl = consolidatedLevel(levels);
  if(lvl===0) return "Level 1 — Position — is not yet consistently held. Everything above it is built on that, so that is where the work is.";
  if(lvl===5) return "Every level is consistently held, including Pinnacle — leading beyond yourself and the organisation. That's a standard to keep, not a box to check.";
  return `Level ${lvl} · ${LEVELS[lvl].name} is consistently held. Level ${lvl+1} · ${LEVELS[lvl+1].name} is where it gets inconsistent — that's the next climb.`;
}

// Stepped pyramid: Position (widest) at the base rising to Pinnacle
// (narrowest) at the apex. Highlighted tiers = held under Maxwell's floor
// rule. Each tier's label row spans full width so it stays legible on a
// phone regardless of how narrow that tier's bar is.
const PYRAMID_WIDTH = {5:"42%",4:"58%",3:"74%",2:"88%",1:"100%"};
function pyramid(levels, consolidated){
  return `<div class="pyr">${[5,4,3,2,1].map(L=>`
    <div class="tier ${L<=consolidated?'on':''}">
      <div class="lbl"><span>${LEVELS[L].name}</span><span class="score">${levels[L].toFixed(1)}</span></div>
      <div class="bar" style="width:${PYRAMID_WIDTH[L]}"></div>
    </div>`).join("")}</div>`;
}

// Stable (not random-per-render) shuffle so per-response report views don't
// reveal anything by their display order — seeded from the round id, so it's
// identical across reloads but unrelated to submission order.
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return h>>>0; }
function seededShuffle(arr, seed){
  const a = arr.slice();
  let s = seed>>>0 || 1;
  const rand = ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ----------------------------------------------------------------- fetch */
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function api(method, path, body){
  const opts = { method, headers:{} };
  if(body!==undefined){ opts.headers["content-type"]="application/json"; opts.body=JSON.stringify(body); }
  for(let attempt=0; attempt<3; attempt++){
    try{
      const res = await fetch(API_BASE+path, opts);
      if(res.status>=500 && attempt<2){ await sleep(300*(attempt+1)+Math.random()*200); continue; }
      let data={};
      try{ data = await res.json(); }catch(e){}
      if(!res.ok) return { ok:false, status:res.status, error:data.error||"error" };
      return { ok:true, data };
    }catch(e){
      if(attempt<2){ await sleep(300*(attempt+1)+Math.random()*200); continue; }
      return { ok:false, status:0, error:"network_error" };
    }
  }
  return { ok:false, status:0, error:"network_error" };
}

/* ------------------------------------------------------------------- copy */
function copy(text, btn, label){
  const done=()=>{ btn.textContent="Copied"; setTimeout(()=>btn.textContent=label,1600); };
  const failed=()=>{ btn.textContent="Couldn't copy — select manually"; setTimeout(()=>btn.textContent=label,2400); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text,done,failed));
  } else {
    fallbackCopy(text,done,failed);
  }
}
function fallbackCopy(text, done, failed){
  const ta=document.createElement("textarea");
  ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; ta.style.top="0"; ta.style.left="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok=false;
  try{ ok=document.execCommand("copy"); }catch(e){ ok=false; }
  document.body.removeChild(ta);
  if(ok) done(); else failed();
}

/* --------------------------------------------------------------- storage */
// Drafts let a rater/leader resume a 20-minute run after a locked phone, a
// dropped tab, or an accidental navigation — nothing is lost until a real
// submit succeeds, at which point the draft is deleted.
function draftKeyFor(mode, selfKind, roundId){
  if(mode==="self") return selfKind==="revise" ? `l360_draft_revise_${roundId}` : "l360_draft_new";
  return `l360_draft_rate_${roundId}`;
}
function saveDraft(){
  try{
    localStorage.setItem(draftKeyFor(state.mode, state.selfKind, state.urlCtx.roundId), JSON.stringify({
      ans:state.ans, order:state.order, q:state.q, role:state.role,
      initials:state.initials, name:state.name, savedAt: Date.now()
    }));
  }catch(e){}
}
function loadDraft(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!Array.isArray(d.ans) || d.ans.length!==ITEMS.length) return null;
    if(!Array.isArray(d.order) || d.order.length!==ITEMS.length) return null;
    return d;
  }catch(e){ return null; }
}
function clearDraft(key){ try{ localStorage.removeItem(key); }catch(e){} }
function rememberLeader(leaderId){ try{ localStorage.setItem("l360_leader", leaderId); }catch(e){} }
function recalledLeader(){ try{ return localStorage.getItem("l360_leader"); }catch(e){ return null; } }
function priorRaterId(roundId){ try{ return localStorage.getItem("l360_rater_"+roundId); }catch(e){ return null; } }

function shuffle(a){

function reportHTML(d){
  // Responses are only scorable against the item bank they were answered on.
  // A round recorded before the bank was expanded has a shorter answer array;
  // drop those rather than index past the end of it and crash the report.
  const compatible = r => r && Array.isArray(r.ans) && r.ans.length === ITEMS.length;
  const staleSelf = d.self && !compatible(d.self);
  const staleRaters = d.raters.filter(r=>!compatible(r)).length;
  const self = compatible(d.self) ? d.self : null;
  const raters = d.raters.filter(compatible);
  const isLeader = !!state.urlCtx.leaderId;
  const backLink = isLeader ? `<a class="link" href="?leader=${state.urlCtx.leaderId}">&larr; Your assessments</a>` : "";

  if((staleSelf || staleRaters) && !self && raters.length===0){
    return `
      <div class="btn-row" style="margin-bottom:8px">${backLink}</div>
      <div class="headline">
        <div class="eyebrow">Earlier version</div>
        <div class="lvl">This round can't be scored</div>
        <p class="muted">It was answered on an earlier, shorter version of the assessment, so its answers don't line up with the current questions. The responses are still stored, but they can't be compared against the current scoring.</p>
        ${ isLeader ? `<p class="muted">Start a new round to get a report on the current version.</p>` : "" }
      </div>
      ${ isLeader ? `<a class="btn btn-primary" href="?leader=${state.urlCtx.leaderId}&newround=1">Start a new round</a>` : "" }`;
  }

  const selfLevels = self ? levelScores(self.ans) : null;
  const selfTraits = self ? traitScores(self.ans) : null;
  const rLevelScores = raters.map(r=>levelScores(r.ans));
  const rTraitScores = raters.map(r=>traitScores(r.ans));

  const othersLevels = {}; LEVEL_KEYS.forEach(L=> othersLevels[L] = raters.length ? mean(rLevelScores.map(s=>s[L])) : 0);
  const othersTraits = {}; TRAIT_KEYS.forEach(k=> othersTraits[k] = raters.length ? mean(rTraitScores.map(s=>s[k])) : 0);
  const consolidated = raters.length ? consolidatedLevel(othersLevels) : 0;
  const overviewAvg = raters.length ? mean(LEVEL_KEYS.map(L=>othersLevels[L])) : 0;

  const groups = {};
  raters.forEach((r,i)=>{ (groups[r.role]=groups[r.role]||[]).push(rTraitScores[i]); });
  const shownGroups = Object.keys(groups).filter(k=>groups[k].length>=2);

  const blind=[], hidden=[];
  if(selfTraits && raters.length) TRAIT_KEYS.forEach(k=>{
    const dlt = selfTraits[k]-othersTraits[k];
    if(dlt>=GAP) blind.push({k,d:dlt});
    else if(dlt<=-GAP) hidden.push({k,d:-dlt});
  });
  blind.sort((a,b)=>b.d-a.d); hidden.sort((a,b)=>b.d-a.d);

  let splits=[];
  if(self && raters.length) splits = ITEMS.map((it,i)=>{
    const oScores = raters.map(r=>it.opts[r.ans[i]].s);
    const counts={}; raters.forEach(r=>counts[r.ans[i]]=(counts[r.ans[i]]||0)+1);
    const modal = modalOption(counts, it.opts);
    return { i, gap: it.opts[self.ans[i]].s - mean(oScores),
             mine: it.opts[self.ans[i]].t, theirs: it.opts[modal].t,
             agree: counts[modal], of: raters.length };
  }).filter(x=>Math.abs(x.gap)>=SPLIT_CUTOFF).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)).slice(0,3);

  const weakestTraits = raters.length ? TRAIT_KEYS.slice().sort((a,b)=>othersTraits[a]-othersTraits[b]).slice(0,3) : [];

  const bar = (cls,label,v)=>`<div class="gbar ${cls}"><span class="k">${label}</span>
    <span class="t"><i style="width:${Math.max(2,(v-1)/4*100)}%"></i></span>
    <span class="v">${v.toFixed(1)}</span></div>`;

  // Per-response pyramid views. Stable shuffle so display order never
  // matches (and therefore can't reveal) submission order.
  if(!state.report.viewOrder) state.report.viewOrder = seededShuffle(raters.map((_,i)=>i), hashStr(d.roundId));
  const viewOrder = state.report.viewOrder;
  const view = state.report.view || "all";

  let vLevels=null, vConsolidated=0, vAvg=0, vEyebrow="", vEmpty=false;
  if(view==="self"){
    vEyebrow = "How you see yourself";
    if(selfLevels){ vLevels=selfLevels; vConsolidated=consolidatedLevel(selfLevels); vAvg=mean(LEVEL_KEYS.map(L=>selfLevels[L])); }
    else vEmpty=true;
  } else if(view.startsWith("r")){
    vEyebrow = "One rater's read of you";
    const idx = Number(view.slice(1));
    vLevels = rLevelScores[idx]; vConsolidated = consolidatedLevel(vLevels); vAvg = mean(LEVEL_KEYS.map(L=>vLevels[L]));
  } else {
    vEyebrow = "What the people around you say";
    if(raters.length){ vLevels=othersLevels; vConsolidated=consolidated; vAvg=overviewAvg; }
    else vEmpty=true;
  }

  const viewTabs = () => {
    const opts=[{key:"all",label:"Everyone"}];
    if(self) opts.push({key:"self",label:"You"});
    viewOrder.forEach((idx,pos)=>opts.push({key:"r"+idx,label:"Response "+(pos+1)}));
    if(opts.length<2) return "";
    return `<div>${opts.map(o=>`<button class="opt small ${view===o.key?'sel':''}" data-report-view="${o.key}">${o.label}</button>`).join("")}</div>`;
  };

  return `
  <div class="btn-row" style="margin-bottom:8px">
    ${backLink}
    <button class="link" data-refresh-report>Refresh</button>
  </div>

  ${ (staleSelf || staleRaters) ? `<div class="err">Left out of this report: ${[
        staleSelf ? "your own self-assessment" : null,
        staleRaters ? `${staleRaters} rater response${staleRaters>1?"s":""}` : null
      ].filter(Boolean).join(" and ")} — answered on an earlier, shorter version of the assessment, so they can't be scored against the current questions.${isLeader?" Start a new round for a clean comparison.":""}</div>` : "" }

  <div class="headline">
    <div class="eyebrow">${vEyebrow}</div>
    ${viewTabs()}
    <div class="spacer" style="height:14px"></div>
    ${ vEmpty ? `
      <div class="lvl">${view==="self" ? "No self-assessment on file" : "Waiting on feedback"}</div>
      <p class="muted">${view==="self" ? "This round doesn't have a self-assessment recorded." : "No one has submitted feedback for this round yet. Share the invite link from your assessments page."}</p>
    ` : `
      <div class="avgnum">${vAvg.toFixed(1)}<span style="font-size:0.35em;font-weight:600;color:var(--fg-muted)"> / 5</span></div>
      ${pyramid(vLevels, vConsolidated)}
      <p class="muted">${floorSentence(vLevels)}</p>
    `}
    <div style="margin-top:14px">
      ${self?`<span class="pill">Self · 1</span>`:""}
      ${Object.keys(groups).map(k=>`<span class="pill">${ROLE_SHORT[k]} · ${groups[k].length}</span>`).join("")}
      ${raters.length===0 ? `<span class="pill">No responses yet</span>`:""}
    </div>
  </div>

  ${ raters.length===0 ? "" : `
  <h2>Nine traits</h2>
  <p class="muted">Grounded in the book's own chapters — the aggregate across all raters. Their read is the orange bar.</p>
  ${TRAIT_KEYS.map(k=>`
    <div class="traitrow">
      <div class="nm">${TRAITS[k].name}</div>
      <div class="dsc">${TRAITS[k].sub}</div>
      ${selfTraits?bar("self","You",selfTraits[k]):""}
      ${bar("others","Them",othersTraits[k])}
      ${shownGroups.map(g=>bar("","· "+ROLE_SHORT[g], mean(groups[g].map(s=>s[k])))).join("")}
    </div>`).join("")}

  ${ selfTraits ? `
  <div class="spacer"></div>
  <h2>Where your read and theirs come apart</h2>
  ${ blind.length===0 && hidden.length===0
    ? `<p class="muted">No trait differs by more than ${GAP} of a point. How you see yourself and how they see you are broadly the same — which is itself worth knowing.</p>`
    : "" }
  ${blind.slice(0,FLAG_LIMIT).map((b,i)=>`<div class="flag"><div class="t">Blind spot · ${TRAITS[b.k].name}</div>
    <div>You rate yourself ${b.d.toFixed(1)} points higher here than the people around you do.${i===0?" This is your widest gap — the one you are least likely to be looking at.":""}</div></div>`).join("")}
  ${ blind.length>FLAG_LIMIT ? `<p class="faint">${blind.length-FLAG_LIMIT} more trait${blind.length-FLAG_LIMIT>1?"s":""} where you rate yourself higher than they do — see the full list above.</p>` : "" }
  ${hidden.slice(0,FLAG_LIMIT).map((h,i)=>`<div class="flag up"><div class="t">Hidden strength · ${TRAITS[h.k].name}</div>
    <div>They rate you ${h.d.toFixed(1)} points higher here than you rate yourself.${i===0?" You are getting credit you are not claiming — and probably not deliberately repeating.":""}</div></div>`).join("")}
  ${ hidden.length>FLAG_LIMIT ? `<p class="faint">${hidden.length-FLAG_LIMIT} more trait${hidden.length-FLAG_LIMIT>1?"s":""} where they rate you higher than you rate yourself.</p>` : "" }
  ` : `<div class="spacer"></div><p class="muted">This round doesn't have a self-assessment on file, so blind spots can't be compared.</p>`}

  ${ splits.length ? `
  <div class="spacer"></div>
  <h2>The sharpest three</h2>
  <p class="muted">The scenarios where you and they described a different leader.</p>
  ${splits.map(s=>`
    <div class="split">
      <div class="sc">${esc(ITEMS[s.i].self)}</div>
      <div class="pair">
        <div class="box"><b>You said</b>${esc(s.mine)}</div>
        <div class="box o"><b>${s.agree} of ${s.of} of them said</b>${esc(s.theirs)}</div>
      </div>
    </div>`).join("")}` : ""}

  <div class="spacer"></div>
  <h2>Three next moves</h2>
  <p class="muted">Taken from the chapters behind your lowest-scoring traits.</p>
  ${weakestTraits.map((c,i)=>`<div class="move"><div class="num">${i+1}</div>
    <div><div>${esc(ACTIONS[c].t)}</div><div class="ref">${esc(ACTIONS[c].ref)}</div></div></div>`).join("")}
  `}

  ${ isLeader ? `
  <div class="spacer"></div>
  <div class="btn-row"><a class="btn" href="?round=${d.roundId}&leader=${state.urlCtx.leaderId}&revise=1">Revise my self-assessment</a></div>` : "" }`;
}

/* ------------------------------------------------------------------ binds */
function bind(){
  const startSelf = app.querySelector("[data-start-self]");
  if(startSelf) startSelf.onclick=()=>beginQuizFlow("self","new");

  const goRecover = app.querySelectorAll("[data-go-recover]");
  goRecover.forEach(b=>b.onclick=()=>{ state.screen="recover"; state.recoverResult=undefined; render(); });

  const doRecover = app.querySelector("[data-do-recover]");
  if(doRecover) doRecover.onclick=async ()=>{
    const v=(document.getElementById('recFind').value||"").trim();
    if(!EMAIL_RE.test(v)) return fail("Enter a valid email.");
    doRecover.textContent="Looking…"; doRecover.disabled=true;
    const r = await api("POST","/recover",{email:v});
    doRecover.textContent="Find my link"; doRecover.disabled=false;
    state.recoverResult = (r.ok && r.data.found) ? r.data.leaderId : false;
    render();
  };

  const fixName = app.querySelector("[data-fix-name]");
  if(fixName) fixName.onclick=()=>{
    const v=(document.getElementById('fixName').value||"").replace(/[^A-Za-z0-9 '.-]/g,"").slice(0,24).trim();
    if(!v) return fail("Please enter a name.");
    state.urlCtx.forName=v;
    state.screen="setup"; state.mode="rate"; state.roundCheck="pending"; state.role=null; state.initials="";
    render();
    checkRoundExists();
  };

  app.querySelectorAll("[data-role]").forEach(b=>b.onclick=()=>{
    state.role=b.dataset.role;
    const nmEl=document.getElementById("nm");
    if(nmEl) state.initials=nmEl.value;
    render();
  });

  const start = app.querySelector("[data-start]");
  if(start) start.onclick=()=>{
    const nm=document.getElementById("nm"), who=document.getElementById("who");
    state.initials=(nm.value||"").replace(/[^A-Za-z0-9 .]/g,"").slice(0,6);
    if(state.mode==="self"){
      state.name=(who.value||"").replace(/[^A-Za-z0-9 '.-]/g,"").slice(0,24).trim();
      if(!state.name) return fail("Please enter your first name.");
    } else {
      if(!state.role) return fail("Please say how you know them.");
    }
    state.q=0; state.ans=new Array(ITEMS.length).fill(null);
    state.order=ITEMS.map(it=>shuffle(it.opts.map((_,i)=>i)));
    enterQuiz();
  };

  const retryCheck = app.querySelector("[data-retry-check]");
  if(retryCheck) retryCheck.onclick=()=>{ state.roundCheck="pending"; render(); checkRoundExists(); };

  const resumeBtn = app.querySelector("[data-resume]");
  if(resumeBtn) resumeBtn.onclick=()=>{
    const d = state.pendingDraft;
    state.ans=d.ans; state.order=d.order; state.q=Math.min(d.q, ITEMS.length-1);
    state.role=d.role||state.role; state.initials=d.initials||""; state.name=d.name||state.name;
    if(d.ans.every(x=>x!==null)){
      history.pushState({l360:"quiz", q:ITEMS.length-1}, "", location.href);
      state.screen="review"; render(); window.scrollTo(0,0);
    } else {
      enterQuiz(true);
    }
  };
  const startOver = app.querySelector("[data-start-over]");
  if(startOver) startOver.onclick=()=>{ clearDraft(state.pendingDraftKey); goToSetup(); };

  const updateAnswers = app.querySelector("[data-update-answers]");
  if(updateAnswers) updateAnswers.onclick=()=>goToSetup();

  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    if(Date.now() - (state._lastRenderAt||0) < TAP_DEBOUNCE_MS) return;
    state.ans[state.q]=Number(b.dataset.opt);
    if(state.reviewMode){
      saveDraft(); // q left at the edited index — fine, ans is fully populated
      state.reviewMode=false; state.screen="review"; render(); window.scrollTo(0,0); return;
    }
    if(state.q < ITEMS.length-1){
      state.q++;
      // Saved AFTER advancing so a resumed draft's q is the next unanswered
      // question, matching what "Continue — question N" on the resume
      // screen promises (saving before the increment would resume back
      // onto the question just answered instead of the next one).
      saveDraft();
      history.pushState({l360:"quiz", q:state.q}, "", location.href);
      state.screen="quiz"; render(); window.scrollTo(0,0);
    } else {
      saveDraft(); // all 36 answered — draft's q stays at the last index
      state.screen="review"; render(); window.scrollTo(0,0);
    }
  });

  const back = app.querySelector("[data-back]");
  if(back) back.onclick=()=>history.back();

  app.querySelectorAll("[data-review-edit]").forEach(b=>b.onclick=()=>{
    state.q=Number(b.dataset.reviewEdit); state.reviewMode=true;
    history.pushState({l360:"quiz", q:state.q}, "", location.href);
    state.screen="quiz"; render(); window.scrollTo(0,0);
  });
  const submitFinal = app.querySelector("[data-submit-final]");
  if(submitFinal) submitFinal.onclick=()=>submitCurrentAndFinish();

  app.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.dataset.copy, b, b.textContent.trim()));

  const retry = app.querySelector("[data-retry-submit]");
  if(retry) retry.onclick=()=>state._retry();

  const refresh = app.querySelector("[data-refresh-report]");
  if(refresh) refresh.onclick=()=>{ state.report={phase:"loading"}; render(); loadReport(); };

  app.querySelectorAll("[data-report-view]").forEach(b=>b.onclick=()=>{
    state.report.view = b.dataset.reportView; render();
  });

  const saveEmail = app.querySelector("[data-save-email]");
  if(saveEmail) saveEmail.onclick=async ()=>{
    const v=(document.getElementById('recEmail').value||"").trim();
    if(!EMAIL_RE.test(v)) return fail("That doesn't look like a valid email.","emailErr");
    saveEmail.textContent="Saving…"; saveEmail.disabled=true;
    const r = await api("POST", `/leader/${state.urlCtx.leaderId}/email`, {email:v});
    if(r.ok){ state.dash.data.email=v; render(); }
    else { saveEmail.textContent="Couldn't save — try again"; saveEmail.disabled=false; }
  };
}

/* --------------------------------------------------------------- actions */
// Entry point for starting (or resuming) any quiz-answering flow: checks for
// a saved draft first so a returning rater/leader is offered resume rather
// than silently starting over (and, for raters, creating an unintended
// duplicate response).
function beginQuizFlow(mode, selfKind){
  state.mode = mode;
  if(mode==="self") state.selfKind = selfKind;
  state.name = state.name || ""; state.initials = state.initials || "";
  const key = draftKeyFor(mode, selfKind, state.urlCtx.roundId);
  const draft = loadDraft(key);
  if(draft){
    state.screen="resume"; state.pendingDraft=draft; state.pendingDraftKey=key;
    render();
    return;
  }
  goToSetup();
}
function goToSetup(){ state.screen="setup"; render(); }
function enterQuiz(isResume){
  state.reviewMode=false;
  history.pushState({l360:"quiz", q:state.q}, "", location.href);
  state.screen="quiz"; render(); window.scrollTo(0,0);
}

window.addEventListener("popstate", (e)=>{
  // Handles the phone back-gesture from both mid-quiz and the review screen
  // (finishing Q36 goes straight to review without pushing a new history
  // entry, so a back-tap from review must still resolve to the last pushed
  // quiz entry, not be silently ignored because state.screen is "review").
  if(e.state && e.state.l360==="quiz"){
    state.q = e.state.q; state.reviewMode=false; state.screen="quiz"; render();
  } else if(state.screen==="quiz" || state.screen==="review"){
    // Backed out of the quiz entirely (no more quiz history entries) — the
    // draft is untouched, so reopening this same link resumes normally.
    state.screen="setup"; render();
  }
});

async function submitCurrentAndFinish(){
  state.screen="submitting"; render();
  let result;
  const draftKey = draftKeyFor(state.mode, state.selfKind, state.urlCtx.roundId);
  if(state.mode==="self"){
    if(state.selfKind==="revise"){
      result = await api("POST", `/round/${state.urlCtx.roundId}/response`,
        {kind:"self", leaderId:state.urlCtx.leaderId, initials:state.initials, ans:state.ans});
    } else {
      result = await api("POST", "/round",
        {leaderId: state.urlCtx.leaderId||undefined, name: state.name, initials: state.initials, ans: state.ans});
    }
  } else {
    result = await api("POST", `/round/${state.urlCtx.roundId}/response`,
      {kind:"rater", role:state.role, initials:state.initials, ans:state.ans, raterId: priorRaterId(state.urlCtx.roundId)||undefined});
  }
  if(!result.ok){
    state.screen="submit-error";
    state.submitErrorKind = (result.status>=400 && result.status<500) ? "terminal" : "retryable";
    state._retry=submitCurrentAndFinish;
    render(); return;
  }
  clearDraft(draftKey);
  if(state.mode==="self" && state.selfKind!=="revise"){
    state.urlCtx.leaderId = result.data.leaderId;
    state.urlCtx.roundId = result.data.roundId;
    history.replaceState(null,"","?leader="+state.urlCtx.leaderId);
    rememberLeader(state.urlCtx.leaderId);
  }
  if(state.mode==="rate" && result.data.raterId){
    try{ localStorage.setItem("l360_rater_"+state.urlCtx.roundId, result.data.raterId); }catch(e){}
  }
  state.doneResult = result.data;
  state.screen="done"; render(); window.scrollTo(0,0);
}

async function checkRoundExists(){
  const r = await api("GET", "/round/"+state.urlCtx.roundId);
  if(!r.ok){
    state.roundCheck = (r.status===404) ? "notfound" : "network_error";
    render(); return;
  }
  state.roundCheck = "ok";
  if(priorRaterId(state.urlCtx.roundId)){ state.screen="already-done"; render(); return; }
  const key = draftKeyFor("rate", null, state.urlCtx.roundId);
  const draft = loadDraft(key);
  if(draft){ state.screen="resume"; state.pendingDraft=draft; state.pendingDraftKey=key; }
  render();
}
async function loadReport(){
  const r = await api("GET", "/round/"+state.urlCtx.roundId);
  state.report = r.ok ? {phase:"ready", data:r.data} : {phase:"error"};
  render();
}
async function prefillRevise(){
  const r = await api("GET", "/round/"+state.urlCtx.roundId);
  if(r.ok && r.data.self) state.initials = r.data.self.initials;
  render();
}
async function loadDashboard(){
  const r = await api("GET", "/leader/"+state.urlCtx.leaderId);
  state.dash = r.ok ? {phase:"ready", data:r.data} : {phase:"error"};
  if(r.ok) rememberLeader(state.urlCtx.leaderId);
  render();
}
async function prefillNewRoundName(){
  const r = await api("GET", "/leader/"+state.urlCtx.leaderId);
  if(r.ok) state.name = r.data.name;
  render();
}

/* ---------------------------------------------------------------- boot */
function boot(){
  const p = new URLSearchParams(location.search);
  const urlCtx = {
    leaderId: p.get("leader") || null,
    roundId:  p.get("round")  || null,
    forName:  p.get("for")    || null,
  };

  if(urlCtx.roundId && urlCtx.forName){
    state = {screen:"setup", mode:"rate", urlCtx, roundCheck:"pending", role:null, initials:""};
    render(); checkRoundExists(); return;
  }
  if(urlCtx.roundId && p.get("report")==="1"){
    state = {screen:"report", urlCtx, report:{phase:"loading"}};
    render(); loadReport(); return;
  }
  if(urlCtx.roundId && p.get("revise")==="1"){
    if(!urlCtx.leaderId){ state = {screen:"need-leader-link", urlCtx}; render(); return; }
    state = {screen:"setup", mode:"self", selfKind:"revise", urlCtx, name:"", initials:""};
    render(); prefillRevise(); return;
  }
  if(urlCtx.roundId && !p.get("report") && !p.get("revise")){
    // round present, but neither a rater's `for=` nor a leader action param —
    // most likely a rater link mangled in transit (chat apps often break
    // autolinking at `&`). Ask for the name instead of falling through to a
    // context-free landing page that would start an unrelated new round.
    state = {screen:"need-name", urlCtx};
    render(); return;
  }
  if(urlCtx.leaderId && p.get("newround")==="1"){
    state = {screen:"setup", mode:"self", selfKind:"new", urlCtx, name:"", initials:""};
    render(); prefillNewRoundName(); return;
  }
  if(urlCtx.leaderId){
    state = {screen:"dashboard", urlCtx, dash:{phase:"loading"}};
    render(); loadDashboard(); return;
  }
  state = {screen:"landing", urlCtx};
  render();
}
boot();
</script>
